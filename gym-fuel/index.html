<!doctype html>
<html lang="en" data-contrast="normal" data-bg="photo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121211">
<meta name="description" content="Gym &amp; Fuel: Iron &amp; Eggs stripped down to training and nutrition. Programmes, set logging, food log, recipes and weight.">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Gym &amp; Fuel</title>
<style>
  /* Layout: one column of cards under a sticky header, five-tab bar fixed at the bottom. */
  :root {
    --bg: #121211;
    --surface: #1a1a19;
    --card: #232322;
    --raised: #2c2c2a;
    --border: #383835;
    --border-w: 1px;
    --text: #ffffff;
    --text-2: #c3c2b7;
    --muted: #8e8d85;
    --accent: #cf4a30;
    --accent-ink: #ffffff;
    --brass: #e2a63c;
    --xp: #b58cf2;
    --good: #0ca30c;
    --warn: #fab219;
    --bad: #d03b3b;
    --scrim: rgba(0, 0, 0, .65);
    --radius: 16px;
    --nav-h: 64px;
    color-scheme: dark;
  }
  /* High contrast (scotopic sensitivity): pure black, white text, yellow/green accents, heavy borders */
  :root[data-contrast="high"] {
    --bg: #000000; --surface: #000000; --card: #000000; --raised: #111111;
    --border: #ffffff; --border-w: 2px;
    --text: #ffffff; --text-2: #ffffff; --muted: #e6e6e6;
    --accent: #ffe600; --accent-ink: #000000; --xp: #ffe600;
    --good: #00ff66; --warn: #ffe600; --bad: #ff5c5c;
    --scrim: rgba(0, 0, 0, .85);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100%;
    padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 16px);
  }
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--surface); border-bottom: var(--border-w) solid var(--border);
  }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  .card { background: var(--card); border: var(--border-w) solid var(--border); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
  :root[data-contrast="normal"] .card { border-color: transparent; }
  .card.slim { padding: 12px 16px; }
  .card h2, .section-h { margin: 0; font-size: 13px; letter-spacing: .8px; text-transform: uppercase; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
  .section-h { padding: 4px 4px 0; }
  .card h2 .right { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--muted); }
  h3 { margin: 0; font-size: 18px; text-wrap: balance; }
  p { margin: 0; }
  ul { margin: 0; padding-left: 20px; }
  .muted { color: var(--muted); font-size: 14px; }
  .small { font-size: 13px; }
  .accent { color: var(--accent); }
  .bad-text { color: var(--bad); }
  .danger { color: var(--bad); }
  .row { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .between { justify-content: space-between; }
  .wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .bar { height: 10px; border-radius: 8px; background: var(--raised); overflow: hidden; border: var(--border-w) solid var(--border); }
  :root[data-contrast="normal"] .bar { border: 0; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 8px; }
  .bar.good > i { background: var(--good); }
  .bar.over > i { background: var(--warn); }
  .bar.xp > i { background: var(--xp); }
  .macro { display: flex; justify-content: space-between; font-size: 14px; font-variant-numeric: tabular-nums; }
  button, .btn {
    font: inherit; font-weight: 700; color: var(--text); cursor: pointer;
    min-height: 48px; padding: 10px 14px; border-radius: 12px;
    background: var(--raised); border: var(--border-w) solid var(--border);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  }
  :root[data-contrast="normal"] button, :root[data-contrast="normal"] .btn { border-color: transparent; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.ghost { background: transparent; }
  button.danger, .ghost.danger { color: var(--bad); }
  button.icon { min-height: 44px; min-width: 44px; padding: 8px; }
  button:disabled { opacity: .4; cursor: default; }
  .small-btn { min-height: 40px; padding: 6px 12px; font-size: 14px; }
  button:active { transform: scale(.98); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .linkish { background: transparent; border: 0; padding: 4px 0; min-height: 44px; display: block; text-align: left; font-weight: 400; width: 100%; }
  input, textarea, select {
    font: inherit; color: var(--text); background: var(--raised);
    border: var(--border-w) solid var(--border); border-radius: 12px;
    min-height: 48px; padding: 10px 12px; width: 100%; min-width: 0;
  }
  input[type="checkbox"] { width: 26px; height: 26px; min-height: 0; flex: none; accent-color: var(--accent); }
  textarea { min-height: 64px; resize: vertical; }
  label.field { display: grid; gap: 6px; font-size: 14px; color: var(--text-2); min-width: 0; }
  label.check-field { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .grid1 { display: grid; gap: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grid4 button { padding: 8px 4px; }
  .seg { display: flex; background: var(--raised); border-radius: 12px; padding: 4px; gap: 4px; border: var(--border-w) solid var(--border); }
  :root[data-contrast="normal"] .seg { border: 0; }
  .seg button { flex: 1; min-height: 42px; background: transparent; border: 0; color: var(--muted); padding: 6px; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--text); }
  :root[data-contrast="high"] .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .subtabs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 4; background: var(--bg); padding-block: 4px; }
  .chiprow { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .pchip { min-height: 40px; padding: 6px 14px; border-radius: 999px; font-size: 14px; white-space: nowrap; flex: none; }
  .pchip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .daychips { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .daychips button { min-height: 52px; font-size: 14px; font-weight: 600; padding: 8px; }
  .daychips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .nexttag { font-size: 11px; font-weight: 800; text-transform: uppercase; padding: 2px 6px; border-radius: 6px; background: var(--good); color: #000; }
  .grouplabel { margin-top: 4px; text-transform: uppercase; letter-spacing: .6px; font-weight: 700; }
  .dayname { margin-top: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--raised); color: var(--text-2); border: var(--border-w) solid var(--border); white-space: nowrap; }
  :root[data-contrast="normal"] .chip { border-color: transparent; }
  .chip.good { color: var(--good); border-color: var(--good); }
  .chip.warn { color: var(--warn); border-color: var(--warn); }
  .chip.bad { color: var(--bad); border-color: var(--bad); }
  .list { display: grid; }
  .list > * { padding: 10px 0; border-top: var(--border-w) solid var(--border); min-width: 0; }
  .list > *:first-child { border-top: 0; }
  .list > [hidden] { display: none; }
  .check { display: flex; align-items: center; gap: 12px; min-height: 48px; width: 100%; background: transparent; border: 0; padding: 4px 0; font-weight: 600; text-align: left; justify-content: flex-start; }
  .box { width: 26px; height: 26px; flex: none; border-radius: 8px; border: 2px solid var(--muted); display: grid; place-items: center; }
  .check[aria-checked="true"] .box { background: var(--good); border-color: var(--good); color: #000; }
  .check .auto { margin-left: auto; }
  .excard { display: grid; gap: 8px; padding: 12px; border-radius: 14px; background: var(--raised); border: var(--border-w) solid var(--border); }
  :root[data-contrast="normal"] .excard { border-color: transparent; }
  .excard.ss-start { border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; box-shadow: inset 4px 0 0 var(--accent); }
  .excard.ss-end { border-top-left-radius: 4px; border-top-right-radius: 4px; box-shadow: inset 4px 0 0 var(--accent); margin-top: -8px; }
  .excard.edit { background: var(--card); border: var(--border-w) dashed var(--border); }
  .setrow { display: grid; grid-template-columns: 44px 1fr auto 1fr; gap: 8px; align-items: center; }
  .setrow input { min-height: 44px; padding: 8px; text-align: center; font-variant-numeric: tabular-nums; }
  .datenav .ghost { flex-direction: row; min-height: 44px; }
  .nowrap { white-space: nowrap; }
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    display: grid; grid-template-columns: repeat(4, 1fr);
    height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--surface); border-top: var(--border-w) solid var(--border);
  }
  nav button { border: 0; border-radius: 0; background: transparent; flex-direction: column; gap: 3px; font-size: 11px; padding-inline: 0; font-weight: 700; color: var(--muted); padding: 6px 0 4px; min-height: var(--nav-h); }
  nav button svg { width: 24px; height: 24px; }
  nav button[aria-current="page"] { color: var(--accent); }
  :root[data-contrast="high"] nav button[aria-current="page"] { box-shadow: inset 0 3px 0 var(--accent); }
  .sheet-wrap { position: fixed; inset: 0; z-index: 30; display: grid; align-items: end; justify-items: center; background: var(--scrim); padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .sheet { width: min(100%, 560px); max-height: calc(100% - 24px); display: grid; grid-template-rows: auto 1fr; gap: 12px; background: var(--card); border: var(--border-w) solid var(--border); border-radius: var(--radius); padding: 16px; }
  .sheet-body { overflow-y: auto; display: grid; gap: 12px; align-content: start; min-height: 0; }
  .ask-text { font-size: 17px; white-space: pre-line; }
  .ask-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .ask-btns button { flex: 1 1 auto; }
  .picker-list { max-height: 55vh; overflow-y: auto; }
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 16px); transform: translateX(-50%);
    background: var(--accent); color: var(--accent-ink); font-weight: 800; padding: 12px 18px; border-radius: 14px; z-index: 40;
    max-width: calc(100% - 32px); text-align: center; box-shadow: 0 6px 24px rgba(0, 0, 0, .5); animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: translate(-50%, 12px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } button:active { transform: none; } }
  @media (max-width: 360px) { .grid3 { grid-template-columns: 1fr 1fr; } }
  .setrow.two { grid-template-columns: 44px 1fr auto; }
  .setrow.extra > span:first-child { color: var(--brass, var(--accent)); font-weight: 700; }
  .excard.feel { display: grid; gap: 8px; }
  .setrow.three { grid-template-columns: 34px 1fr auto 1fr auto 1fr; gap: 6px; }
  .setrow.three input { padding: 8px 4px; }
  .center { text-align: center; }
  .warn-text { color: var(--warn); }
  .tierdesc { padding: 0 4px; }
  .card > .chain:first-of-type { border-top: 0; }
  .pchip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  /* Recipe cards */
  .rgrid { display: grid; gap: 16px; }
  .rcard { background: var(--card); border: var(--border-w) solid var(--border); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
  :root[data-contrast="normal"] .rcard { border-color: transparent; }
  .rhead { display: grid; gap: 6px; }
  .rhead h3 { font-size: 20px; }
  .tags { gap: 6px; }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: .3px; color: var(--text-2); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }
  .chip.meal-breakfast { color: var(--warn); border-color: var(--warn); }
  .chip.meal-lunch { color: var(--good); border-color: var(--good); }
  .chip.meal-dinner { color: var(--xp); border-color: var(--xp); }
  .macros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .macros span { display: grid; justify-items: center; padding: 8px 4px; border-radius: 12px; background: var(--raised); font-size: 11.5px; color: var(--text-2); }
  .macros b { font-size: 19px; color: var(--text); font-variant-numeric: tabular-nums; }
  .macros span:first-child b { color: var(--accent); }
  .howto { justify-content: space-between; min-height: 44px; border: var(--border-w) solid var(--border); }
  .rbody { display: grid; gap: 10px; }
  .rlabel { font-size: 12px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--text-2); }
  .ings { display: grid; }
  .ings .check { min-height: 40px; font-weight: 400; font-size: 15px; }
  .ings .box { width: 22px; height: 22px; border-radius: 6px; }
  .tip { padding: 10px 12px; border-radius: 12px; background: var(--raised); }
  .rfoot { gap: 8px; }
  .rfoot .addto { flex: 1 1 160px; width: auto; min-height: 44px; font-weight: 700; }
  /* Techniques */
  .chip.tech { color: var(--xp); border-color: var(--xp); }
  .tech-card { padding: 10px 0; border-top: var(--border-w) solid var(--border); }
  .tech-card summary { cursor: pointer; min-height: 44px; }
  .tech-card ol { margin: 8px 0; display: grid; gap: 4px; }
  .tech-card p { margin-top: 4px; }
  .spark { width: 100%; height: 30px; color: var(--accent); margin-top: 4px; }
  .subtabs .seg button { font-size: 13px; padding: 6px 2px; }
  .prevbadge { display: grid; place-items: center; align-content: center; width: 70px; height: 70px; border-radius: 50%; background: var(--raised); box-shadow: inset 0 0 0 2.5px var(--accent); font-size: 22px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; flex: none; text-align: center; }
  .excard .prevbadge { background: var(--card); }
  .prevbadge small { font-size: 10px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); }
  .prevbadge.base { box-shadow: inset 0 0 0 2.5px var(--xp); }
  .prevbadge.none { box-shadow: inset 0 0 0 2px var(--border); color: var(--muted); }
  /* Look: an old-school iron gym. A photo behind everything (your photo), faded into the dark so text
     stays readable, translucent cards, and a condensed poster face for headings. */
  :root { --display: "Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif; }
  body { font-family: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  :root[data-bg="photo"] body { background: transparent; }
  :root[data-bg="photo"] body::before {
    content: ''; position: fixed; inset: 0; z-index: -2;
    background: url(bg.jpg) center 15% / cover no-repeat;
    filter: contrast(1.05) brightness(.85);
    opacity: .8;
  }
  :root[data-bg="photo"] body::after {
    content: ''; position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(180deg, rgba(18,18,17,.15) 0%, rgba(18,18,17,.45) 45%, rgba(18,18,17,.75) 80%, rgba(18,18,17,.9) 100%);
  }
  :root[data-bg="photo"] .card { background: rgba(35, 35, 34, .8); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  :root[data-bg="photo"] header { background: rgba(26, 26, 25, .82); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  :root[data-bg="photo"] nav { background: rgba(26, 26, 25, .94); }
  :root[data-contrast="high"] body::before, :root[data-contrast="high"] body::after { display: none; }
  :root[data-contrast="high"] body { background: var(--bg); }
  header h1 { font-family: var(--display); font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
  .card h2 { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: 1.4px; }
  .card h2 .right { font-family: "Barlow", system-ui, sans-serif; font-size: 12px; }
  .card.hero-card { box-shadow: inset 0 3px 0 var(--brass); }
  @media (prefers-reduced-transparency: reduce) { :root[data-bg="photo"] .card { background: var(--card); } }
  .card.alert { border-left: 4px solid var(--bad); }
  #scan-video { width: 100%; max-height: 260px; border-radius: 10px; background: #000; object-fit: cover; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 12px; }
  .stat b { display: block; font-size: 22px; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--text-2); font-size: 12.5px; }
  .steps { display: grid; gap: 10px; padding-left: 0; list-style: none; counter-reset: step; }
  .steps li { counter-increment: step; display: grid; grid-template-columns: 28px 1fr; gap: 10px; font-size: 15px; }
  .steps li::before { content: counter(step); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 14px; }
  #photo-grid { display: grid; gap: 12px; }
  .photo-row { display: grid; gap: 6px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pair figure { margin: 0; display: grid; gap: 4px; min-width: 0; }
  .pair img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 8px; background: var(--raised); }
  .pair figcaption { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
  .setup-sug { padding: 10px 12px; border-radius: 12px; background: var(--raised); }
  /* Lift progress chart: one series in the accent, recessive grid, big tap targets */
  .liftchart { width: 100%; height: auto; display: block; overflow: visible; font-family: inherit; }
  .liftchart .grid { stroke: var(--border); stroke-width: 1; }
  .liftchart .tick { fill: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .liftchart .series { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .liftchart .dot { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
  .liftchart .best .dot { fill: var(--card); stroke: var(--accent); stroke-width: 2.5; }
  .liftchart .hit { fill: transparent; cursor: pointer; }
  .liftchart .pt:focus { outline: none; }
  .liftchart .pt:focus-visible .hit, .liftchart .pt.on .hit { fill: var(--accent); fill-opacity: .18; }
  .liftchart .label { fill: var(--text); font-size: 11px; font-weight: 700; }
  .inline-link { display: inline; width: auto; min-height: 32px; padding: 4px 0; color: var(--accent); font-weight: 700; font-size: 13px; }
  .kcal-pill { font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: var(--raised); color: var(--text); font-variant-numeric: tabular-nums; }
  .card.alert { border-left: 4px solid var(--bad); }
  #scan-video { width: 100%; max-height: 260px; border-radius: 10px; background: #000; object-fit: cover; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  label.btn { cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1 id="title">Gym &amp; Fuel</h1>
  <span class="kcal-pill" id="kcal-pill"></span>
</header>
<main id="view" aria-live="polite"></main>
<nav id="nav" aria-label="Sections"></nav>
<script src="data.js"></script>
<script src="scan.js"></script>
<script src="photos.js"></script>
<script src="app.js"></script>
</body>
</html>
