<!doctype html>
<html lang="en" data-contrast="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121211">
<meta name="description" content="Council: a personal therapy and life app. Commitments, goals, projects and Council sessions built around Actions vs Words.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Council</title>
<style>
  /* Same layout as Trainer: one column of cards, sticky header, tab bar at the bottom. Gold accent tells them apart. */
  :root {
    --bg: #121211;
    --surface: #1a1a19;
    --card: #232322;
    --raised: #2c2c2a;
    --border: #383835;
    --border-w: 1px;
    --text: #ffffff;
    --text-2: #c3c2b7;
    --muted: #8e8d85;
    --accent: #e0a93b;
    --accent-ink: #121211;
    --cool: #3987e5;
    --good: #0ca30c;
    --warn: #fab219;
    --bad: #d03b3b;
    --scrim: rgba(0, 0, 0, .65);
    --radius: 16px;
    --nav-h: 64px;
    color-scheme: dark;
  }
  /* High contrast (scotopic sensitivity), as in Trainer. */
  :root[data-contrast="high"] {
    --bg: #000000; --surface: #000000; --card: #000000; --raised: #111111;
    --border: #ffffff; --border-w: 2px;
    --text: #ffffff; --text-2: #ffffff; --muted: #e6e6e6;
    --accent: #ffe600; --accent-ink: #000000; --cool: #66ccff;
    --good: #00ff66; --warn: #ffe600; --bad: #ff5c5c;
    --scrim: rgba(0, 0, 0, .85);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100%;
    padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 16px);
  }
  body.timing { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 92px); }
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--surface); border-bottom: var(--border-w) solid var(--border);
  }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  .pill { font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: var(--raised); border: var(--border-w) solid var(--border); color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  .card { background: var(--card); border: var(--border-w) solid var(--border); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
  :root[data-contrast="normal"] .card { border-color: transparent; }
  .card.flag { box-shadow: inset 4px 0 0 var(--warn); }
  .card.alert { box-shadow: inset 4px 0 0 var(--bad); }
  .card.focus { box-shadow: inset 0 0 0 2px var(--accent); }
  .card h2, .section-h { margin: 0; font-size: 13px; letter-spacing: .8px; text-transform: uppercase; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
  .section-h { padding: 4px 4px 0; }
  .card h2 .right { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--muted); }
  h3 { margin: 0; font-size: 18px; text-wrap: balance; }
  p { margin: 0; }
  ul, ol { margin: 0; padding-left: 20px; }
  .muted { color: var(--muted); font-size: 14px; }
  .small { font-size: 13px; }
  .accent { color: var(--accent); }
  .good-text { color: var(--good); }
  .warn-text { color: var(--warn); }
  .danger { color: var(--bad); }
  .why { font-size: 13px; color: var(--muted); }
  .why::before { content: 'Why: '; font-weight: 800; color: var(--text-2); }
  .row { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .between { justify-content: space-between; }
  .wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .top { align-items: flex-start; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 12px; }
  .stat b { display: block; font-size: 22px; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--text-2); font-size: 12.5px; }
  .bar { height: 10px; border-radius: 8px; background: var(--raised); overflow: hidden; border: var(--border-w) solid var(--border); position: relative; }
  :root[data-contrast="normal"] .bar { border: 0; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 8px; }
  .bar.good > i { background: var(--good); }
  .bar.warn > i { background: var(--warn); }
  .bar.bad > i { background: var(--bad); }
  .bar.cool > i { background: var(--cool); }
  .bar > em { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); }
  button, .btn {
    font: inherit; font-weight: 700; color: var(--text); cursor: pointer;
    min-height: 48px; padding: 10px 14px; border-radius: 12px;
    background: var(--raised); border: var(--border-w) solid var(--border);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  }
  :root[data-contrast="normal"] button, :root[data-contrast="normal"] .btn { border-color: transparent; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.ghost { background: transparent; }
  button.danger { color: var(--bad); }
  button.icon { min-height: 44px; min-width: 44px; padding: 8px; }
  button:disabled { opacity: .4; cursor: default; }
  .small-btn { min-height: 40px; padding: 6px 12px; font-size: 14px; }
  button:active { transform: scale(.98); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  input, textarea, select {
    font: inherit; color: var(--text); background: var(--raised);
    border: var(--border-w) solid var(--border); border-radius: 12px;
    min-height: 48px; padding: 10px 12px; width: 100%; min-width: 0;
  }
  textarea { min-height: 72px; resize: vertical; }
  label.field { display: grid; gap: 6px; font-size: 14px; color: var(--text-2); min-width: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .seg { display: flex; background: var(--raised); border-radius: 12px; padding: 4px; gap: 4px; border: var(--border-w) solid var(--border); }
  :root[data-contrast="normal"] .seg { border: 0; }
  .seg button { flex: 1; min-height: 40px; background: transparent; border: 0; color: var(--muted); padding: 6px 2px; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--text); }
  :root[data-contrast="high"] .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .scale { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .scale button { min-height: 42px; padding: 0; }
  .scale button[aria-pressed="true"], .pchip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .scaleq { display: grid; gap: 6px; }
  .scaleq .row span { font-size: 14px; color: var(--text-2); }
  .chiprow { display: flex; gap: 8px; flex-wrap: wrap; }
  .pchip { min-height: 38px; padding: 6px 12px; border-radius: 999px; font-size: 14px; white-space: nowrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--raised); color: var(--text-2); border: var(--border-w) solid var(--border); white-space: nowrap; }
  :root[data-contrast="normal"] .chip { border-color: transparent; }
  .chip.good { color: var(--good); border-color: var(--good); }
  .chip.warn { color: var(--warn); border-color: var(--warn); }
  .chip.bad { color: var(--bad); border-color: var(--bad); }
  .chip.acc { color: var(--accent); border-color: var(--accent); }
  .list { display: grid; }
  .list > * { padding: 10px 0; border-top: var(--border-w) solid var(--border); min-width: 0; }
  .list > *:first-child { border-top: 0; }
  .commit { display: grid; gap: 8px; padding: 12px; border-radius: 14px; background: var(--raised); }
  .commit.one { box-shadow: inset 4px 0 0 var(--accent); }
  .commit.done { opacity: .7; }
  .commit.done .ctext { text-decoration: line-through; }
  .ctext { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
  .tick { flex: none; width: 32px; height: 32px; border-radius: 10px; border: 2.5px solid var(--muted); display: grid; place-items: center; font-weight: 900; font-size: 18px; background: transparent; padding: 0; min-height: 32px; }
  .tick.on { background: var(--good); border-color: var(--good); color: #000; }
  .tick.miss { background: var(--bad); border-color: var(--bad); color: #fff; }
  .star { color: var(--accent); font-weight: 900; }
  .bigscore { font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .bigtime { font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .ring { width: 84px; height: 84px; flex: none; }
  .quote { font-size: 17px; font-style: italic; line-height: 1.5; }
  .lens { display: grid; gap: 6px; padding: 10px 12px; border-radius: 12px; background: var(--raised); }
  .lens b { font-size: 14px; }
  .stepnum { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 13px; flex: none; }
  .verdict { padding: 12px; border-radius: 12px; background: var(--raised); display: grid; gap: 6px; }
  .verdict.good { box-shadow: inset 4px 0 0 var(--good); }
  .verdict.warn { box-shadow: inset 4px 0 0 var(--warn); }
  .verdict.bad { box-shadow: inset 4px 0 0 var(--bad); }
  .verdict.none { box-shadow: inset 4px 0 0 var(--border); }
  .std { display: grid; gap: 6px; padding: 10px 0; border-top: var(--border-w) solid var(--border); }
  .std:first-child { border-top: 0; }
  .std .seg button[aria-pressed="true"].g { background: var(--good); color: #000; }
  .std .seg button[aria-pressed="true"].w { background: var(--warn); color: #000; }
  .std .seg button[aria-pressed="true"].b { background: var(--bad); color: #fff; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 90px; }
  .bars > div { flex: 1; display: grid; gap: 4px; justify-items: center; align-content: end; height: 100%; min-width: 0; }
  .bars i { display: block; width: 100%; border-radius: 6px 6px 2px 2px; background: var(--accent); min-height: 2px; }
  .bars i.empty { background: var(--raised); }
  .bars span { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .spark { width: 100%; height: 34px; color: var(--accent); }
  .domrow { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; }
  .domicon { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--raised); font-weight: 800; font-size: 14px; color: var(--accent); }
  .timerbar {
    position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); z-index: 9;
    display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--accent); color: var(--accent-ink);
  }
  .timerbar .grow { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .timerbar b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .timerbar button { min-height: 40px; padding: 6px 10px; background: var(--accent-ink); color: var(--accent); font-size: 14px; }
  details summary { cursor: pointer; font-weight: 700; min-height: 36px; display: flex; align-items: center; }
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    display: grid; grid-template-columns: repeat(6, 1fr);
    height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--surface); border-top: var(--border-w) solid var(--border);
  }
  nav button { border: 0; border-radius: 0; background: transparent; flex-direction: column; gap: 3px; font-size: 11px; font-weight: 700; color: var(--muted); padding: 6px 0 4px; min-height: var(--nav-h); }
  nav button svg { width: 24px; height: 24px; }
  nav button[aria-current="page"] { color: var(--accent); }
  :root[data-contrast="high"] nav button[aria-current="page"] { box-shadow: inset 0 3px 0 var(--accent); }
  .sheet-wrap { position: fixed; inset: 0; z-index: 30; display: grid; align-items: end; justify-items: center; background: var(--scrim); padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .sheet { width: min(100%, 560px); max-height: calc(100vh - 56px); max-height: calc(100dvh - 56px); display: grid; grid-template-rows: auto 1fr; gap: 12px; background: var(--card); border: var(--border-w) solid var(--border); border-radius: var(--radius); padding: 16px; }
  .sheet-body { overflow-y: auto; display: grid; gap: 12px; align-content: start; min-height: 0; }
  .ask-text { font-size: 17px; white-space: pre-line; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btns > button { flex: 1 1 auto; }
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 16px); transform: translateX(-50%);
    background: var(--text); color: var(--bg); font-weight: 800; padding: 12px 18px; border-radius: 14px; z-index: 40;
    max-width: calc(100% - 32px); text-align: center; box-shadow: 0 6px 24px rgba(0, 0, 0, .5); animation: pop .25s ease-out;
  }
  body.timing .toast { bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 84px); }
  @keyframes pop { from { transform: translate(-50%, 12px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } button:active { transform: none; } }
  @media (max-width: 360px) { .grid3 { grid-template-columns: 1fr 1fr; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  /* Coach */
  .chat { display: grid; gap: 10px; }
  .msg { padding: 10px 12px; border-radius: 14px; max-width: 92%; overflow-wrap: anywhere; line-height: 1.45; }
  .msg.user { justify-self: end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .msg.assistant { justify-self: start; background: var(--raised); border-bottom-left-radius: 4px; }
  .modes { display: grid; gap: 8px; }
  .modecard { display: grid; justify-content: stretch; justify-items: start; gap: 2px; text-align: left; padding: 12px 14px; min-height: 56px; width: 100%; }
  button.opt { text-align: left; justify-content: flex-start; min-height: 48px; }
  button.opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .subcard { display: grid; gap: 8px; padding: 10px; border-radius: 12px; background: var(--card); }
  .scale { grid-template-columns: repeat(6, 1fr); }
  .pre { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <h1 id="title">Council</h1>
  <span class="pill" id="saydo-pill" title="Say/Do, last 7 days"></span>
  <button class="icon ghost" id="contrast-btn" aria-label="Toggle high contrast" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
  </button>
</header>
<main id="view" aria-live="polite"></main>
<div id="timer-slot"></div>
<nav id="nav" aria-label="Sections"></nav>
<script src="data.js"></script>
<script src="coach-data.js"></script>
<script src="coach.js"></script>
<script src="app.js"></script>
</body>
</html>
