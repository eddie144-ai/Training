<!doctype html>
<html lang="en" data-contrast="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d0c">
<meta name="description" content="Life RPG: the 4 pillars as one-tap quests, with stats, HP and streaks. Reads Trainer data so nothing is logged twice.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Life RPG</title>
<style>
  /* Same layout as Trainer and Council: sticky header, one column of cards, tab bar at the bottom.
     Tactical dark look with a lime accent tells it apart. */
  :root {
    --bg: #0b0d0c;
    --surface: #111413;
    --card: #171b19;
    --raised: #212724;
    --border: #2f3833;
    --border-w: 1px;
    --text: #f4f7f5;
    --text-2: #bfc8c2;
    --muted: #87918b;
    --accent: #b5f23d;
    --accent-ink: #0b0d0c;
    --xp: #38d9f5;
    --hp: #f04848;
    --good: #3ddc6a;
    --warn: #fab219;
    --bad: #f04848;
    --STR: #ff6b4a; --VIT: #3ddc6a; --INT: #38a8f5; --DISC: #b98cff; --CAP: #f5c542; --CHA: #ff7ac6;
    --scrim: rgba(0, 0, 0, .7);
    --radius: 14px;
    --nav-h: 64px;
    --dock-h: 58px;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  :root[data-contrast="high"] {
    --bg: #000; --surface: #000; --card: #000; --raised: #111;
    --border: #fff; --border-w: 2px;
    --text: #fff; --text-2: #fff; --muted: #e6e6e6;
    --accent: #ffe600; --accent-ink: #000; --xp: #66ccff; --hp: #ff5c5c;
    --good: #00ff66; --warn: #ffe600; --bad: #ff5c5c;
    --scrim: rgba(0, 0, 0, .85);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100%;
    padding-bottom: calc(var(--nav-h) + var(--dock-h) + env(safe-area-inset-bottom, 0px) + 16px);
  }
  header.hud {
    position: sticky; top: 0; z-index: 5; padding: 10px 16px 12px; padding-top: calc(10px + env(safe-area-inset-top, 0px));
    background: var(--surface); border-bottom: var(--border-w) solid var(--border); display: grid; gap: 8px;
  }
  .hud-top { display: flex; align-items: center; gap: 10px; }
  .lvl { font: 800 13px/1 var(--mono); letter-spacing: 1px; padding: 7px 9px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); white-space: nowrap; }
  .hud-top h1 { font-size: 17px; margin: 0; flex: 1; letter-spacing: .5px; text-transform: uppercase; }
  .meters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .meter { display: grid; gap: 3px; }
  .meter .lab { display: flex; justify-content: space-between; font: 700 11px/1 var(--mono); color: var(--text-2); letter-spacing: .5px; }
  .bar { height: 9px; border-radius: 3px; background: var(--raised); overflow: hidden; position: relative; }
  :root[data-contrast="high"] .bar { border: 1px solid var(--border); }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width .5s ease-out; }
  .bar.hp > i { background: var(--hp); }
  .bar.xp > i { background: var(--xp); }
  .statrow { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .st { text-align: center; padding: 4px 0; border-radius: 6px; background: var(--raised); font-family: var(--mono); }
  .st b { display: block; font-size: 15px; line-height: 1.1; color: var(--c, var(--text)); }
  .st span { font-size: 10px; color: var(--muted); letter-spacing: .5px; }
  .st.bump { animation: bump .6s ease-out; }
  @keyframes bump { 0% { box-shadow: 0 0 0 2px var(--c), 0 0 14px var(--c); } 100% { box-shadow: 0 0 0 0 transparent; } }
  main { max-width: 640px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  .card { background: var(--card); border: var(--border-w) solid var(--border); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; min-width: 0; }
  .card.alert { box-shadow: inset 4px 0 0 var(--bad); }
  .card.focus { box-shadow: inset 4px 0 0 var(--accent); }
  .card h2 { margin: 0; font: 800 12px/1.2 var(--mono); letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
  .card h2 .right { margin-left: auto; letter-spacing: 0; color: var(--muted); }
  .card h2 .num { color: var(--accent); }
  h3 { margin: 0; font-size: 15px; }
  p { margin: 0; }
  ul, ol { margin: 0; padding-left: 20px; }
  .muted { color: var(--muted); font-size: 14px; }
  .small { font-size: 13px; }
  .mono { font-family: var(--mono); }
  .accent { color: var(--accent); }
  .good-text { color: var(--good); }
  .bad-text { color: var(--bad); }
  .warn-text { color: var(--warn); }
  .row { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .between { justify-content: space-between; }
  .wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  button, .btn {
    font: inherit; font-weight: 700; color: var(--text); cursor: pointer;
    min-height: 46px; padding: 10px 14px; border-radius: 10px;
    background: var(--raised); border: var(--border-w) solid var(--border);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  }
  :root[data-contrast="normal"] button { border-color: transparent; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.ghost { background: transparent; }
  button.danger { color: var(--bad); }
  button.icon { min-height: 44px; min-width: 44px; padding: 8px; }
  button.small-btn { min-height: 38px; padding: 6px 12px; font-size: 14px; }
  button:disabled { opacity: .4; cursor: default; }
  button:active { transform: scale(.97); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  input, select, textarea {
    font: inherit; color: var(--text); background: var(--raised);
    border: var(--border-w) solid var(--border); border-radius: 10px;
    min-height: 46px; padding: 10px 12px; width: 100%; min-width: 0;
  }
  label.field { display: grid; gap: 6px; font-size: 14px; color: var(--text-2); min-width: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: flex; background: var(--raised); border-radius: 10px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; min-height: 38px; background: transparent; border: 0; color: var(--muted); padding: 6px 2px; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--text); }
  :root[data-contrast="high"] .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .chip { display: inline-flex; align-items: center; gap: 4px; font: 700 11px/1 var(--mono); padding: 4px 7px; border-radius: 5px; background: var(--raised); color: var(--text-2); white-space: nowrap; }
  .chip.stat { color: var(--c); }
  .chip.good { color: var(--good); }
  .chip.bad { color: var(--bad); }
  .chip.acc { color: var(--accent); }
  .list { display: grid; }
  .list > * { padding: 10px 0; border-top: var(--border-w) solid var(--border); min-width: 0; }
  .list > *:first-child { border-top: 0; }

  /* Quest rows: the whole row is the tap target. */
  .quest { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px; background: var(--raised); min-height: 56px; width: 100%; text-align: left; justify-content: flex-start; font-weight: 400; }
  .quest .tick { flex: none; width: 30px; height: 30px; border-radius: 7px; border: 2.5px solid var(--muted); display: grid; place-items: center; font-weight: 900; font-size: 17px; }
  .quest.done .tick { background: var(--good); border-color: var(--good); color: #000; }
  .quest.rest .tick { background: var(--xp); border-color: var(--xp); color: #000; }
  .quest.miss .tick { background: var(--bad); border-color: var(--bad); color: #fff; }
  .quest.done .qlabel { color: var(--text-2); }
  .quest .qlabel { font-weight: 700; display: block; overflow-wrap: anywhere; }
  .quest .qsub { font-size: 12.5px; color: var(--muted); display: block; }
  .quest .qxp { margin-left: auto; text-align: right; font: 700 12px/1.3 var(--mono); color: var(--muted); white-space: nowrap; }
  .quest.core { box-shadow: inset 3px 0 0 var(--hp); }
  .quest.flash { animation: flash .7s ease-out; }
  @keyframes flash { 0% { box-shadow: inset 0 0 0 2px var(--accent), 0 0 18px var(--accent); } 100% { box-shadow: inset 0 0 0 0 transparent; } }
  .qgrid { display: grid; gap: 8px; }
  .pillar-h { display: flex; align-items: center; gap: 8px; font: 800 12px/1 var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin-top: 4px; }
  .pillar-h .n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 4px; background: var(--accent); color: var(--accent-ink); font-size: 11px; }
  .goal { display: grid; gap: 8px; padding: 10px 0 2px 12px; border-left: 2px solid var(--border); }
  .goal-t { font-weight: 700; font-size: 14px; color: var(--text-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .dots { display: flex; gap: 3px; }
  .dots i { width: 9px; height: 9px; border-radius: 2px; background: var(--raised); display: block; }
  .dots i.done { background: var(--good); } .dots i.rest { background: var(--xp); } .dots i.miss { background: var(--bad); } .dots i.off { opacity: .3; }
  .big { font: 800 34px/1 var(--mono); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kpi { background: var(--raised); border-radius: 10px; padding: 10px; display: grid; gap: 2px; }
  .kpi b { font: 800 20px/1.1 var(--mono); }
  .kpi span { font-size: 12px; color: var(--muted); }
  .daynav { display: flex; align-items: center; gap: 8px; }
  .daynav b { flex: 1; text-align: center; font-family: var(--mono); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal div { aspect-ratio: 1; border-radius: 4px; background: var(--raised); display: grid; place-items: center; font: 700 11px var(--mono); color: var(--muted); }
  .cal div.perfect { background: var(--good); color: #000; }
  .cal div.part { background: color-mix(in srgb, var(--good) 35%, var(--raised)); color: var(--text); }
  .cal div.hurt { box-shadow: inset 0 0 0 2px var(--bad); }
  .cal div.today { outline: 2px solid var(--accent); }
  .cal div.off { opacity: .25; }
  .cal span { font: 700 10px var(--mono); color: var(--muted); text-align: center; }
  .statline { display: grid; grid-template-columns: 48px 1fr 60px; gap: 10px; align-items: center; font-family: var(--mono); }
  .statline b { color: var(--c); }
  .statline .bar > i { background: var(--c); }
  .event { display: grid; grid-template-columns: 64px 1fr; gap: 8px; font-size: 14px; }
  .event span:first-child { font: 700 12px var(--mono); color: var(--muted); }

  /* Quick execution dock: one tap for the primary daily quests, always above the tab bar. */
  .dock {
    position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); z-index: 9;
    display: flex; gap: 6px; padding: 6px 8px; overflow-x: auto; background: var(--surface); border-top: var(--border-w) solid var(--border);
    height: var(--dock-h); scrollbar-width: none;
  }
  .dock::-webkit-scrollbar { display: none; }
  .dock button { flex: 1 0 auto; min-height: 44px; padding: 6px 10px; font-size: 13px; white-space: nowrap; border: 1px solid var(--border); }
  .dock button.on { background: color-mix(in srgb, var(--good) 22%, var(--raised)); border-color: var(--good); color: var(--good); }
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    display: grid; grid-template-columns: repeat(4, 1fr);
    height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--surface); border-top: var(--border-w) solid var(--border);
  }
  nav button { border: 0; border-radius: 0; background: transparent; flex-direction: column; gap: 3px; font-size: 11px; font-weight: 700; color: var(--muted); padding: 6px 0 4px; min-height: var(--nav-h); }
  nav button svg { width: 24px; height: 24px; }
  nav button[aria-current="page"] { color: var(--accent); }
  .sheet-wrap { position: fixed; inset: 0; z-index: 30; display: grid; align-items: end; justify-items: center; background: var(--scrim); padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .sheet { width: min(100%, 560px); max-height: calc(100dvh - 56px); display: grid; gap: 12px; background: var(--card); border: var(--border-w) solid var(--border); border-radius: var(--radius); padding: 16px; overflow-y: auto; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btns > button { flex: 1 1 auto; }
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--dock-h) + env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%);
    background: var(--text); color: var(--bg); font-weight: 800; padding: 11px 16px; border-radius: 10px; z-index: 40;
    max-width: calc(100% - 32px); text-align: center; box-shadow: 0 6px 24px rgba(0, 0, 0, .5); animation: pop .25s ease-out;
  }
  .toast.xp { background: var(--accent); color: var(--accent-ink); font-family: var(--mono); }
  .toast.hurt { background: var(--bad); color: #fff; }
  @keyframes pop { from { transform: translate(-50%, 12px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .toast, .quest.flash, .st.bump { animation: none; } .bar > i { transition: none; } button:active { transform: none; } }
  @media (max-width: 360px) { .statrow { grid-template-columns: repeat(3, 1fr); } .kpis { grid-template-columns: 1fr 1fr; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header class="hud" id="hud"></header>
<main id="view" aria-live="polite"></main>
<div class="dock" id="dock" aria-label="Quick log"></div>
<nav id="nav" aria-label="Sections"></nav>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
