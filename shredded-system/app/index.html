<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shredded System</title>
<meta name="theme-color" content="#14110e">
<meta name="description" content="The Gironda Cut: meal templates, carb-up clock, weight trend and weekly decisions for 95 kg to 70-75 kg.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout: one phone-width column of panels under a sticky status header, five tabs at the bottom.
     Look: an old-school iron gym. Warm charcoal, bone text, oxblood for protein and meat, brass for the carb-up. */
  :root {
    --bg: #14110e;
    --surface: #1b1713;
    --card: #221d18;
    --raised: #2d261f;
    --line: #3d342a;
    --text: #efe6d8;
    --text-2: #cbbfac;
    --muted: #978b79;
    --accent: #cf4a30;
    --accent-ink: #fff7ee;
    --brass: #e2a63c;
    --good: #7dbb6d;
    --warn: #e2a63c;
    --bad: #ef5a4f;
    --protein: #cf4a30;
    --fat: #d9b765;
    --carb: #e2a63c;
    --fibre: #7dbb6d;
    --kcal: #efe6d8;
    --scrim: rgba(8, 6, 4, .72);
    --display: "Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --radius: 12px;
    --nav-h: 62px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.45 var(--body); min-height: 100%; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 20px); }
  header.top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
    padding: 10px 16px; display: grid; gap: 8px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { margin: 0; font: 800 22px/1 var(--display); letter-spacing: 1.5px; text-transform: uppercase; flex: 1; }
  .brand h1 small { display: block; font: 600 11px/1.3 var(--mono); letter-spacing: .5px; color: var(--muted); text-transform: none; margin-top: 3px; }
  .glance { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .gl { background: var(--raised); border-radius: 8px; padding: 6px 8px; min-width: 0; }
  .gl b { display: block; font: 600 15px/1.2 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gl span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  main { max-width: 680px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  .panel { background: var(--card); border-radius: var(--radius); padding: 14px; display: grid; gap: 12px; min-width: 0; }
  .panel.carbup { box-shadow: inset 0 0 0 2px var(--brass); }
  .panel.alert { box-shadow: inset 0 0 0 2px var(--bad); }
  .panel.note { background: transparent; border: 1px dashed var(--line); }
  h2 { margin: 0; font: 800 19px/1.1 var(--display); letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: baseline; gap: 8px; text-wrap: balance; }
  h2 .right { margin-left: auto; font: 600 12px var(--mono); letter-spacing: 0; text-transform: none; color: var(--muted); }
  h3 { margin: 0; font-size: 15px; font-weight: 700; }
  p { margin: 0; }
  ul, ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
  a { color: var(--brass); }
  .muted { color: var(--muted); font-size: 14px; }
  .small { font-size: 13px; }
  .mono { font-family: var(--mono); }
  .row { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .between { justify-content: space-between; }
  .wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .good-t { color: var(--good); } .bad-t { color: var(--bad); } .warn-t { color: var(--warn); } .brass-t { color: var(--brass); }
  button, .btn {
    font: inherit; font-weight: 600; color: var(--text); cursor: pointer; min-height: 44px; padding: 9px 14px; border-radius: 9px;
    background: var(--raised); border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); }
  button.brass { background: var(--brass); color: #1b1309; }
  button.ghost { background: transparent; border-color: var(--line); }
  button.small { min-height: 36px; padding: 5px 11px; font-size: 14px; }
  button.icon { min-width: 44px; padding: 8px; background: transparent; }
  button:disabled { opacity: .45; cursor: default; }
  button:active { transform: scale(.98); }
  :focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: 9px; min-height: 44px; padding: 8px 11px; width: 100%; min-width: 0; }
  textarea { min-height: 90px; font: 13px/1.4 var(--mono); }
  label.f { display: grid; gap: 5px; font-size: 13px; color: var(--text-2); min-width: 0; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .seg { display: flex; background: var(--raised); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; min-height: 38px; background: transparent; color: var(--muted); padding: 5px 4px; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
  .seg.type button[data-v="carbup"][aria-pressed="true"] { box-shadow: inset 0 -2px 0 var(--brass); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { min-height: 34px; padding: 4px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--raised); color: var(--text-2); }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .chip.red[aria-pressed="true"] { background: var(--bad); color: #fff; }
  .tag { display: inline-flex; align-items: center; font: 600 11px/1 var(--mono); padding: 4px 7px; border-radius: 5px; background: var(--raised); color: var(--text-2); white-space: nowrap; }
  .tag.good { color: var(--good); } .tag.bad { color: var(--bad); } .tag.brass { color: var(--brass); }
  .list { display: grid; }
  .list > * { padding: 9px 0; border-top: 1px solid var(--line); min-width: 0; }
  .list > *:first-child { border-top: 0; padding-top: 0; }

  /* Macro bars: label, bar with a target tick, value. */
  .macros { display: grid; gap: 7px; }
  .mrow { display: grid; grid-template-columns: 62px 1fr 104px; gap: 10px; align-items: center; font: 500 13px var(--mono); }
  .mrow > span:first-child { color: var(--text-2); font-family: var(--body); font-weight: 600; }
  .mrow > span:last-child { text-align: right; white-space: nowrap; }
  .bar { height: 10px; background: var(--raised); border-radius: 3px; position: relative; overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c, var(--accent)); border-radius: 3px; transition: width .4s ease-out; }
  .bar.over i { background: repeating-linear-gradient(45deg, var(--c), var(--c) 5px, color-mix(in srgb, var(--c) 55%, var(--bg)) 5px 10px); }

  /* Meals: the whole card is the tap target. */
  .meal { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: start; padding: 11px; border-radius: 10px; background: var(--raised); width: 100%; text-align: left; font-weight: 400; }
  .meal .tick { width: 30px; height: 30px; border-radius: 7px; border: 2.5px solid var(--muted); display: grid; place-items: center; font-weight: 800; }
  .meal.on .tick { background: var(--good); border-color: var(--good); color: #10200c; }
  .meal.on { opacity: .82; }
  .meal b { display: block; font-weight: 700; }
  .meal .items { font-size: 13px; color: var(--muted); display: block; margin-top: 2px; }
  .meal .mk { font: 600 12px/1.35 var(--mono); color: var(--text-2); text-align: right; white-space: nowrap; }
  .clock { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
  .clock svg { width: 76px; height: 76px; }
  .big { font: 800 34px/1 var(--display); letter-spacing: .5px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kpi { background: var(--raised); border-radius: 9px; padding: 9px 10px; display: grid; gap: 1px; min-width: 0; }
  .kpi b { font: 600 18px/1.2 var(--mono); }
  .kpi span { font-size: 12px; color: var(--muted); }
  .stepper { display: grid; grid-template-columns: 44px 1fr 44px; gap: 6px; align-items: center; }
  .stepper b { text-align: center; font: 600 17px var(--mono); }
  .verdict { padding: 12px; border-radius: 10px; background: var(--raised); display: grid; gap: 4px; box-shadow: inset 4px 0 0 var(--v, var(--muted)); }
  .verdict b { font: 800 20px/1.1 var(--display); letter-spacing: .6px; text-transform: uppercase; }
  .chart { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--muted); font: 500 10px var(--mono); }
  .tbl { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .setrow { display: grid; grid-template-columns: 26px 1fr 1fr 1fr; gap: 6px; align-items: center; }
  .setrow span { font: 600 12px var(--mono); color: var(--muted); }
  .setrow input { min-height: 40px; padding: 6px 8px; text-align: center; font-family: var(--mono); }
  details { border-top: 1px solid var(--line); padding-top: 10px; }
  details:first-of-type { border-top: 0; padding-top: 0; }
  summary { cursor: pointer; font-weight: 700; min-height: 32px; display: flex; align-items: center; }
  details > div { display: grid; gap: 8px; padding: 6px 0 4px; }
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; display: grid; grid-template-columns: repeat(5, 1fr);
    height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--surface); border-top: 1px solid var(--line);
  }
  nav button { border-radius: 0; background: transparent; flex-direction: column; gap: 3px; font-size: 11px; font-weight: 700; color: var(--muted); padding: 6px 0 4px; min-height: var(--nav-h); letter-spacing: .4px; text-transform: uppercase; }
  nav button svg { width: 22px; height: 22px; }
  nav button[aria-current="page"] { color: var(--text); box-shadow: inset 0 3px 0 var(--accent); }
  .sheet-wrap { position: fixed; inset: 0; z-index: 30; display: grid; align-items: end; justify-items: center; background: var(--scrim); padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .sheet { width: min(100%, 560px); max-height: calc(100dvh - 48px); overflow-y: auto; display: grid; gap: 12px; background: var(--card); border-radius: var(--radius); padding: 16px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btns > * { flex: 1 1 auto; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%); z-index: 40; background: var(--text); color: var(--bg); font-weight: 700; padding: 11px 16px; border-radius: 10px; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.5); animation: pop .2s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, 10px); } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } .bar i { transition: none; } button:active { transform: none; } }
  @media (max-width: 380px) { .glance { grid-template-columns: repeat(2, 1fr); } .mrow { grid-template-columns: 54px 1fr 92px; } .g3 { grid-template-columns: 1fr 1fr; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="view" aria-live="polite"></main>
<nav id="nav" aria-label="Sections"></nav>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
